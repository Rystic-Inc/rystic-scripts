# generated by rystic export compose — project kalshi-bot
# images are pinned by TAG (--no-digest); a digest pin is what makes a run reproducible — export again with the registry reachable
services:
  exchange:
    environment:
      RYSTIC_LICENSE: ${RYSTIC_LICENSE}
      RYSTIC_SCENARIO: thin_book
    hostname: exchange
    image: registry.rystic.ai/kalshi-twin:0.0.37
    init: true
    labels:
      ai.rystic.product: kalshi-twin
      ai.rystic.project: kalshi-bot
      ai.rystic.service: exchange
      ai.rystic.version: 0.0.37
    ports:
    - 8080:8080
  exchange-crash:
    environment:
      RYSTIC_LICENSE: ${RYSTIC_LICENSE}
      RYSTIC_SCENARIO: flash_crash
    hostname: exchange-crash
    image: registry.rystic.ai/kalshi-twin:0.0.37
    init: true
    labels:
      ai.rystic.product: kalshi-twin
      ai.rystic.project: kalshi-bot
      ai.rystic.service: exchange-crash
      ai.rystic.version: 0.0.37
    ports:
    - 8081:8080
