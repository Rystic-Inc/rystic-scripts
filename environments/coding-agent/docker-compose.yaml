# generated by rystic export compose — project coding-agent
# images are pinned by TAG (--no-digest); a digest pin is what makes a run reproducible — export again with the registry reachable
services:
  github:
    environment:
      RYSTIC_LICENSE: ${RYSTIC_LICENSE}
      RYSTIC_SCENARIO: github-pulls_bot_pr_queue
    hostname: github
    image: registry.rystic.ai/github-pulls-twin:0.0.10
    init: true
    labels:
      ai.rystic.product: github-pulls-twin
      ai.rystic.project: coding-agent
      ai.rystic.service: github
      ai.rystic.version: 0.0.10
    ports:
    - 8080:8080
  linear:
    environment:
      RYSTIC_LICENSE: ${RYSTIC_LICENSE}
      RYSTIC_SCENARIO: linear_triage_inbox
    hostname: linear
    image: registry.rystic.ai/linear-twin:0.0.1
    init: true
    labels:
      ai.rystic.product: linear-twin
      ai.rystic.project: coding-agent
      ai.rystic.service: linear
      ai.rystic.version: 0.0.1
    ports:
    - 8081:8080
  slack:
    environment:
      RYSTIC_LICENSE: ${RYSTIC_LICENSE}
      RYSTIC_SCENARIO: design_studio
    hostname: slack
    image: registry.rystic.ai/slack-twin:0.0.16
    init: true
    labels:
      ai.rystic.product: slack-twin
      ai.rystic.project: coding-agent
      ai.rystic.service: slack
      ai.rystic.version: 0.0.16
    ports:
    - 8082:8080
