# generated by rystic export compose — project design-studio
# images are pinned by TAG (--no-digest); a digest pin is what makes a run reproducible — export again with the registry reachable
services:
  lob:
    environment:
      RYSTIC_LICENSE: ${RYSTIC_LICENSE}
      RYSTIC_SCENARIO: design_studio
    hostname: lob
    image: registry.rystic.ai/lob-twin:0.0.6
    init: true
    labels:
      ai.rystic.product: lob-twin
      ai.rystic.project: design-studio
      ai.rystic.service: lob
      ai.rystic.version: 0.0.6
