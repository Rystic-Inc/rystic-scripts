# generated by rystic export compose — project stripe-ci
# images are pinned by TAG (--no-digest); a digest pin is what makes a run reproducible — export again with the registry reachable
services:
  stripe:
    environment:
      RYSTIC_LICENSE: ${RYSTIC_LICENSE}
      RYSTIC_SCENARIO: design_studio
    hostname: stripe
    image: registry.rystic.ai/stripe-twin:0.0.8
    init: true
    labels:
      ai.rystic.product: stripe-twin
      ai.rystic.project: stripe-ci
      ai.rystic.service: stripe
      ai.rystic.version: 0.0.8
    ports:
    - 8080:8080
